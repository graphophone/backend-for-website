syntax = "proto3";
package follows;

service Follows {
    rpc GetUserFollowsCount(UserId) returns (FollowsCount);
    rpc ToggleFollow(ToggleFollowReq) returns (Empty);
    rpc GetUserFollowers(GetFollowsReq) returns (FollowsPage);
    rpc GetUserFollowings(GetFollowsReq) returns (FollowsPage);
}

message Empty {}

message UserId {
    int64 user_id = 1;
}

message FollowsCount {
    int64 followings_count = 1;
    int64 followers_count = 2;
}

message ToggleFollowReq {
    int64 followee_id = 1;
    int64 follower_id = 2;
}

message GetFollowsReq {
    int64 user_id = 1;
    int64 page_number = 2;
}

message FollowsPage {
    int64 total_pages = 1;
    repeated int64 user_ids = 2;
}