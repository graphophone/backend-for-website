syntax = "proto3";
package follows;

service Follows {
    rpc GetFollowsCount(GetFollowsCountReq) returns (FollowsCount);
    rpc ToggleFollow(ToggleFollowReq) returns (Empty);
    rpc GetFollowers(GetFollowsReq) returns (FollowsPage);
    rpc GetFollowings(GetFollowsReq) returns (FollowsPage);
}

message Empty {}

message GetFollowsCountReq {
    int64 user_id = 1;
    optional int64 follower_id = 2;
}

message FollowsCount {
    int64 followings_count = 1;
    int64 followers_count = 2;
    bool is_followed = 3;
}

message ToggleFollowReq {
    int64 followee_id = 1;
    int64 follower_id = 2;
}

message GetFollowsReq {
    int64 user_id = 1;
    int64 page_number = 2;
    optional int64 requestor_id = 3;
}

message FollowsPage {
    int64 total_pages = 1;
    repeated FollowEntry follows = 2;
}

message FollowEntry {
    int64 user_id = 1;
    FollowsCount follows_count = 2;
}