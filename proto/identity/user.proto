syntax = "proto3";

package user;

option go_package = "graphophone.identity/internal/services/common/user";

service UserService {
    rpc GetUserProfile(GetProfileRequest) returns (UserProfile) {}
    rpc UpdateUserProfile(UpdateUserProfileRequest) returns (Empty) {}
    rpc UpdateUserPassword(UpdateUserPasswordRequest) returns (Empty) {}
    rpc UpdateUserAvatar(UpdateUserAvatarRequest) returns (Empty) {}
    rpc DeactivateUser(DeactivateUserProfileRequest) returns (Empty) {}
    rpc ActivateUserProfile(ActivateUserProfileRequest) returns (Empty) {}
}

message Empty {}

message UserProfile {
    uint32 id = 1;
    string username = 2;
    optional string first_name = 3;
    optional string last_name = 4;
    optional string bio = 5;
    optional string country = 6;
    optional string city = 7;
    optional string avatar_url = 8;
}

message GetProfileRequest {
    uint32 user_id = 1;
}

message UpdateUserProfileRequest {
    uint32 user_id = 1;
    string username = 2;
    optional string first_name = 3;
    optional string last_name = 4;
    optional string bio = 5;
    optional string country = 6;
    optional string city = 7;
}

message UpdateUserPasswordRequest {
    uint32 user_id = 1;
    string old_password = 2;
    string new_password = 3;
}

message UpdateUserAvatarRequest {
    uint32 user_id = 1;
    optional bytes image = 2;
}

message DeactivateUserProfileRequest {
    uint32 user_id = 1;
}

message ActivateUserProfileRequest {
    uint32 user_id = 1;
}
