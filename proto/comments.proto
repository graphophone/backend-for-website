syntax = "proto3";
package comments;

service Comments {
    rpc AddComment(AddCommentReq) returns (CommentEntry);
    rpc RemoveComment(RemoveCommentReq) returns (Empty);
    rpc UpdateComment(UpdateCommentReq) returns (Empty);
    rpc CheckOwner(CheckOwnerReq) returns (Empty);
    rpc ToggleLike(ToggleLikeReq) returns (Empty);
    rpc GetComments(GetCommentsReq) returns (CommentsPage);
}

message Empty {}

message AddCommentReq {
    int64 music_id = 1;
    int64 user_id = 2;
    string content = 3;
}

message RemoveCommentReq {
    int64 comment_id = 1;
}

message UpdateCommentReq {
    int64 comment_id = 1;
    string new_content = 2;
}

message CheckOwnerReq {
    int64 user_id = 1;
    int64 comment_id = 2;
}

message ToggleLikeReq {
    int64 user_id = 1;
    int64 comment_id = 2;
}

message GetCommentsReq {
    int64 music_id = 1;
    int64 page_number = 2;
    optional int64 requester_id = 3;
}

message CommentsPage {
    int64 total_pages = 1;
    repeated CommentEntry comments = 2;
}

message CommentEntry {
    int64 comment_id = 1;
    int64 commenter_id = 2;
    string content = 3;
    int64 created_at = 4;
    int64 likes_count = 5;
    bool is_liked = 6;
}